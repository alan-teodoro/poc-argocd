apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alan-teodoro/poc-argocd
    targetRevision: upgrade-test
    path: argocd/manifests/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

