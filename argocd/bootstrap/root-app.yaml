apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-enterprise-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alan-teodoro/poc-argocd
    targetRevision: upgrade-test
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

