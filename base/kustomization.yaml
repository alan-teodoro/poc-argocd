resources:
  - redb.yaml

replacements:
  - source:
      kind: ConfigMap
      name: db-config
      fieldPath: data.memorySize
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.memorySize

  - source:
      kind: ConfigMap
      name: db-config
      fieldPath: data.databasePort
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.databasePort

  - source:
      kind: ConfigMap
      name: db-config
      fieldPath: data.databaseSecretName
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.databaseSecretName
