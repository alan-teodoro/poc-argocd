apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-all-dbs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alan-teodoro/poc-argocd
    targetRevision: HEAD
    path: overlays/all-dbs
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      selfHeal: true
      prune: true