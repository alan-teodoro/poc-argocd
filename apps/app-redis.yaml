apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/alan-teodoro/poc-argocd'
    targetRevision: HEAD
    path: overlays/all-dbs  # << ALTERADO AQUI
  destination:
    server: https://kubernetes.default.svc
    namespace: redis        # << RECOMENDADO: use o namespace real do seu Redis
  syncPolicy:
    automated:
      selfHeal: true
      prune: true