resources:
  - ../../base/redb.yaml
  - db-config.yaml

replacements:
  - source:
      kind: ConfigMap
      name: db2-db-config
      fieldPath: data.memorySize
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.memorySize
  - source:
      kind: ConfigMap
      name: db2-db-config
      fieldPath: data.databasePort
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.databasePort
  - source:
      kind: ConfigMap
      name: db2-db-config
      fieldPath: data.databaseSecretName
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - spec.databaseSecretName
  - source:
      kind: ConfigMap
      name: db2-db-config
      fieldPath: metadata.name
    targets:
      - select:
          kind: RedisEnterpriseDatabase
        fieldPaths:
          - metadata.name
